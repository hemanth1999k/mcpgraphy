[project]
name = "mcpgraphy"
version = "0.1.0"
description = "Learned, uncertainty-aware behavior graphs for MCP tools: probe safely, map what tools really do, offer state-aware actions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Hemanth Dhanasekaran" }]
keywords = ["mcp", "model-context-protocol", "agents", "tools", "behavior-graph", "proxy", "safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "mcp==2.3.0",
    "pydantic>=2.9",
    "aalpy==2.0.0",
]

[project.scripts]
mcpgraphy = "mcpgraphy.cli:main"

[project.urls]
Homepage = "https://github.com/hemanth1999k/mcpgraphy"
Repository = "https://github.com/hemanth1999k/mcpgraphy"
Issues = "https://github.com/hemanth1999k/mcpgraphy/issues"
Changelog = "https://github.com/hemanth1999k/mcpgraphy/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
    "hypothesis>=6",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpgraphy"]

[tool.hatch.build.targets.sdist]
only-include = ["src/mcpgraphy", "examples", "LICENSE", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E501"]
