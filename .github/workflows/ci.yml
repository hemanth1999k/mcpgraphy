name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --frozen --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest
      - name: CLI smoke
        run: uv run mcpgraphy --help
